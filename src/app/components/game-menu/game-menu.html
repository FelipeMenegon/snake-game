<div class="menu-overlay">
  <div class="menu-modal">

    <div class="snake-decoration">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <h1 class="game-title">
      <span>SNAKE</span>
    </h1>


    @if (!gameStarted) {
    <p class="subtitle">Seja bem-vindo(a)!</p>
    <div class="menu-buttons">
      <button class="menu-button primary" (click)="play.emit()">
        <span class="icon">▶</span>
        JOGAR
      </button>
    </div>
    } @else {
    <p class="subtitle">Jogo Pausado!</p>
    <div class="menu-buttons">
      <button class="menu-button primary" (click)="play.emit()">
        <span class="icon">▶</span>
        CONTINUAR
      </button>
    </div>
    }

    @if (!gameStarted) {
    <div class="high-score">
      <span>MAIOR PONTUAÇÃO:</span>
      <strong>{{highScore}}</strong>
    </div>
    } @else {
    <div class="high-score">
      <span>PONTUAÇÃO:</span>
      <strong>{{score}}</strong>
    </div>
    }
  </div>
</div>
